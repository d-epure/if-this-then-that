/* ---------- API ---------- */
function errMsg(e){
  var m=e&&e.message?e.message:"";
  if(m==="NO_KEY")return "Add your API key above.";
  return m?("Error: "+m):"Something went wrong. Try again.";
}

async function callAPI(prompt,maxTok){
  var key=getKey();
  if(!key)throw new Error("NO_KEY");
  var res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({model:MODEL,max_tokens:maxTok,messages:[{role:"user",content:prompt}]})
  });
  var d=await res.json();
  if(!res.ok)throw new Error((d&&d.error&&d.error.message)?d.error.message:("HTTP "+res.status));
  var txt=(d.content||[]).map(function(b){return b.text||"";}).join("");
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}

function genCtx(cat,type,if_){
  var t=TM[type]||TM.SA;
  return callAPI("Leadership card. Cat:"+cat+" Type:"+t.label+"\nIF:\""+if_+"\"\nReturn ONLY valid JSON, no markdown:\n{\"mis\":\"How leaders misread this. 1 sentence.\",\"sig\":[\"signal 1\",\"signal 2\",\"signal 3\"],\"ris\":\"Risk if ignored. 1 sentence.\",\"det\":\"Self-check question?\",\"then_\":\"Leader response. 2 sentences.\",\"p\":\"Core principle. 1 sentence.\",\"wif\":\"Observable sign it worked. 1 sentence.\",\"cem\":\"Common execution mistake. 1 sentence.\",\"tone\":\"How to be when delivering this. 1 short sentence.\",\"resist\":\"What to do if the response does not land. 1-2 sentences.\"}",700);
}
